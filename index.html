<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKU Generator</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        input, button {
            padding: 8px;
        }

        button {
            background-color: black;
            color: white;
            border: none;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
        }
    </style>

    <link rel="stylesheet"
          href="https://pyscript.net/releases/2025.2.4/core.css">

    <script type="module"
            src="https://pyscript.net/releases/2025.2.4/core.js">
    </script>
</head>

<body>

    <h1>SKU Generator</h1>
    <p>Enter the product information</p>

    <label for="category">Product Category</label>
    <input type="text" id="category">

    <br><br>

    <label for="product">Product Name</label>
    <input type="text" id="product">

    <br><br>

    <label for="quantity">Stock Quantity</label>
    <input type="number" id="quantity">

    <br><br>

    <button py-click="generate">GENERATE SKU</button>

    <div id="result">
        SKU here
    </div>

    <script type="py" src="./main.py"></script>

</body>
</html>
